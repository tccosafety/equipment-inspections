name: Update Equipment Inspection V2

on:
  repository_dispatch:
    types: [update-inspection-v2]

permissions:
  contents: write

concurrency:
  group: equipment-inspection-json
  cancel-in-progress: false

jobs:
  update-inspection:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Merge inspection into status file
        env:
          INSPECTION: ${{ toJson(github.event.client_payload) }}
        run: |
          python3 <<'PY'
          import json
          import os
          from pathlib import Path
          from datetime import datetime, timezone

          path = Path("inspections-today.json")

          inspection = json.loads(os.environ["INSPECTION"])

          inspection_date = inspection.get("Date", "")
          equipment_id = inspection.get("EquipmentID", "")

          # --------------------------------------------------
          # Timestamp helper
          # --------------------------------------------------

          def parse_time(value):
              if not value:
                  return datetime.min.replace(tzinfo=timezone.utc)

              try:
                  return datetime.fromisoformat(
                      str(value).replace("Z", "+00:00")
                  )
              except (ValueError, TypeError):
                  return datetime.min.replace(tzinfo=timezone.utc)

          incoming_time = parse_time(
              inspection.get("InspectionTime", "")
          )

          # --------------------------------------------------
          # Read existing JSON
          # --------------------------------------------------

          try:
              existing = json.loads(
                  path.read_text(encoding="utf-8")
              )

              if not isinstance(existing, list):
                  existing = []

          except (FileNotFoundError, json.JSONDecodeError):
              existing = []

          # --------------------------------------------------
          # Keep only the incoming inspection's calendar date
          # --------------------------------------------------

          existing = [
              record
              for record in existing
              if record.get("Date") == inspection_date
          ]

          # --------------------------------------------------
          # Equipment identity
          # --------------------------------------------------
          #
          # Contractor + Inspection Type + Equipment ID
          # uniquely identify a dashboard equipment record.
          # --------------------------------------------------

          def equipment_key(record):
              return (
                  str(record.get("Contractor", "")),
                  str(record.get("InspectionType", "")),
                  str(record.get("EquipmentID", ""))
              )

          new_key = equipment_key(inspection)

          matching_record = None

          for record in existing:
              if equipment_key(record) == new_key:
                  matching_record = record
                  break

          # --------------------------------------------------
          # Protect against out-of-order events
          # --------------------------------------------------

          should_update = True

          if matching_record is not None:

              existing_time = parse_time(
                  matching_record.get("InspectionTime", "")
              )

              if existing_time > incoming_time:
                  should_update = False

                  print(
                      "Incoming inspection is older than "
                      "the current equipment status."
                  )

                  print(
                      f"Existing: {existing_time.isoformat()}"
                  )

                  print(
                      f"Incoming: {incoming_time.isoformat()}"
                  )

          # --------------------------------------------------
          # Update only when incoming record is newest
          # --------------------------------------------------

          if should_update:

              existing = [
                  record
                  for record in existing
                  if equipment_key(record) != new_key
              ]

              existing.append(inspection)

              print(
                  f"Updated equipment {equipment_id}"
              )

          else:

              print(
                  f"Skipped older inspection for "
                  f"equipment {equipment_id}"
              )

          # --------------------------------------------------
          # Sort output
          # --------------------------------------------------

          existing.sort(
              key=lambda record: (
                  str(
                      record.get("Contractor", "")
                  ).lower(),

                  str(
                      record.get("InspectionType", "")
                  ).lower(),

                  str(
                      record.get("EquipmentID", "")
                  ).lower()
              )
          )

          # --------------------------------------------------
          # Write JSON
          # --------------------------------------------------

          path.write_text(
              json.dumps(
                  existing,
                  indent=2,
                  ensure_ascii=False
              ) + "\n",
              encoding="utf-8"
          )

          print(
              f"Current equipment records: {len(existing)}"
          )

          PY

      - name: Commit updated inspection data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add inspections-today.json

          if git diff --cached --quiet; then
            echo "No inspection data changes to commit."
          else
            git commit -m "Update equipment inspection status"
            git push
          fi
